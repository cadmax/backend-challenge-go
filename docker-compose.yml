name: jungle-wager

x-app: &app
  image: jungle-wager:local
  pull_policy: never
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s
  environment: &app-env
    HTTP_ADDR: :8080
    DATABASE_URL: postgres://wager:wager-local@postgres:5432/wager?sslmode=disable
    OIDC_ISSUER_URL: http://localhost:${KEYCLOAK_PORT:-8081}/realms/jungle
    OIDC_JWKS_URL: http://keycloak:8080/realms/jungle/protocol/openid-connect/certs
    OIDC_AUDIENCE: wagering-api
    AWS_REGION: us-east-1
    BROKER_CREDENTIALS_FILE: /run/wager-aws/app.env
    SQS_ENDPOINT: http://localstack:4566
    SQS_QUEUE_NAME: wager-transactions.fifo
    SQS_EVENT_QUEUE_NAME: wager-events.fifo
    SQS_DLQ_NAME: wager-transactions-dlq.fifo
    WORKERS_ENABLED: ${WORKERS_ENABLED:-true}
    REFERENCE_MAX_ATTEMPTS: ${REFERENCE_MAX_ATTEMPTS:-8}
    REFERENCE_TTL: ${REFERENCE_TTL:-24h}
    REFERENCE_POLL_INTERVAL: ${REFERENCE_POLL_INTERVAL:-1s}
    OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-500ms}
    SQS_WAIT_SECONDS: ${SQS_WAIT_SECONDS:-10}
    SQS_VISIBILITY_SECONDS: ${SQS_VISIBILITY_SECONDS:-30}
    PROCESS_TIMEOUT: ${PROCESS_TIMEOUT:-10s}
    SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-20s}
  volumes:
    - broker-credentials:/run/wager-aws:ro
  depends_on:
    migrate:
      condition: service_completed_successfully
    keycloak:
      condition: service_healthy
    localstack:
      condition: service_healthy
  healthcheck:
    test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8080/health/ready]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 10s

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-local
      POSTGRES_DB: postgres
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-55432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/001-databases.sql:/docker-entrypoint-initdb.d/001-databases.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d wager']
      interval: 3s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-secret
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak-local
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - 127.0.0.1:${KEYCLOAK_PORT:-8081}:8080
    volumes:
      - ./infra/keycloak/jungle-realm.json:/opt/keycloak/data/import/jungle-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, bash, -ec, "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  localstack:
    image: localstack/localstack:4.7.0
    environment:
      SERVICES: sqs,iam,sts
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT_STRATEGY: dynamic
    ports:
      - 127.0.0.1:${LOCALSTACK_PORT:-4567}:4566
    volumes:
      - ./infra/localstack/init.sh:/etc/localstack/init/ready.d/init.sh:ro
      - ./infra/localstack:/opt/wager-bootstrap:ro
      - broker-credentials:/run/wager-aws
    healthcheck:
      test: [CMD-SHELL, 'test -f /run/wager-aws/ready && awslocal sqs get-queue-url --queue-name wager-transactions.fifo >/dev/null']
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  migrate:
    image: jungle-wager:local
    build: .
    command: [/app/migrate, up]
    environment:
      DATABASE_URL: postgres://wager_owner:wager-owner-local@postgres:5432/wager?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app
    ports:
      - 127.0.0.1:${HTTP_PORT:-8080}:8080

  app2:
    <<: *app
    profiles: [multi]
    ports:
      - 127.0.0.1:${HTTP_PORT_2:-8082}:8080

  app3:
    <<: *app
    profiles: [multi]
    ports:
      - 127.0.0.1:${HTTP_PORT_3:-8083}:8080

volumes:
  postgres-data:
  broker-credentials:
